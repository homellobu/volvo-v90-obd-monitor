[hardware]
adapter = "OBD2-RJ45-ENET-2M"
model = "unverified"
interface = "ethernet"
transport = "unverified"
vehicle = "Volvo V90 Cross Country D4 2018"
platform = "SPA"

[host]
# Raspberry Pi 4 built-in Ethernet is suitable as the host network interface.
# USB Ethernet is optional; do not assume the adapter's IP address.
interface = "auto"
address = ""
port = 13400

[safety]
read_only = true
allow_dtc_clear = false
allow_reprogramming = false
allow_actuator_tests = false
poll_interval_seconds = 2
